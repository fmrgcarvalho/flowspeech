name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpeechDesk.sln

      - name: Build
        run: dotnet build SpeechDesk.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/SpeechDesk.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish app
        run: dotnet publish src/SpeechDesk.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechDesk-win-x64
          path: publish
