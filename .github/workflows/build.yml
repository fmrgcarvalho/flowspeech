name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FlowSpeech.sln

      - name: Build
        run: dotnet build FlowSpeech.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FlowSpeech.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish app
        run: dotnet publish src/FlowSpeech.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FlowSpeech-win-x64
          path: publish
